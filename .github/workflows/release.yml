name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: macos-intel
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: macos-apple-silicon
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/zap${{ matrix.ext || '' }} .

      - name: Package Unix executable
        if: matrix.goos != 'windows'
        run: tar -C dist -czf zap-${{ matrix.suffix }}.tar.gz zap

      - name: Package Windows executable
        if: matrix.goos == 'windows'
        run: cd dist && zip ../zap-${{ matrix.suffix }}.zip zap.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-${{ matrix.suffix }}
          path: zap-${{ matrix.suffix }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zap-*.tar.gz
            zap-*.zip
          generate_release_notes: true
